<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<title>CBTI OG card</title>
<link rel="stylesheet" href="/assets/cw/cw.css">
<link rel="stylesheet" href="/assets/cbti/cbti.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { display: block; min-height: 0; background: var(--surface); }
  .card { box-sizing: border-box; width: 1200px; height: 630px; padding: 72px 80px 56px 96px; display: grid; grid-template-columns: 1fr 470px; column-gap: 56px; }
  .copy { display: flex; flex-direction: column; }
  .mark { width: 44px; height: 44px; background: var(--accent); }
  .name { margin-top: 44px; font-size: 112px; font-weight: 600; line-height: .92; letter-spacing: -0.045em; color: var(--text); }
  .line { margin-top: 30px; font-size: 30px; line-height: 1.3; letter-spacing: -0.01em; color: var(--text); }
  .line-zh { margin-top: 14px; font-size: 28px; line-height: 1.5; color: var(--text-2); }
  .base { margin-top: auto; display: flex; justify-content: space-between; padding-top: 20px; border-top: 1px solid var(--line-strong); font-family: var(--font-mono); font-size: 22px; color: var(--text-2); }
  .map { align-self: center; margin-top: 0; min-height: 0; }
</style>
</head>
<body>
  <div id="landing" class="screen" hidden></div>
  <div class="card">
    <div class="copy">
      <div class="mark"></div>
      <div class="name" lang="en">CBTI</div>
      <div class="line" lang="en">Crypto Behavioral Type Indicator</div>
      <div class="line-zh">加密行为类型指标<br>30 道题 · 24 种人格 · 风险 × 信念</div>
      <div class="base"><span lang="en">cbti.club</span><span lang="en">by Chase Wang</span></div>
    </div>
    <div class="cbti-map map" id="og-map"></div>
  </div>
  <script src="/data.js"></script>
  <script src="/app.js"></script>
  <script>TypeMap.mount(document.getElementById('og-map'), {});</script>
</body>
</html>
